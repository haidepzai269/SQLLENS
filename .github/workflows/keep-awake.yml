name: keep-awake

# Lịch tự động đã chuyển sang cron-job.org vì GitHub Actions dồn nhịp cron
# (đo 2026-11-23: 3,1 lần/ngày thay vì 144). File này giữ lại để bấm tay.
on:
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping health endpoint
        env:
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
        run: |
          if [ -z "$API_HEALTH_URL" ]; then
            echo "Repo variable API_HEALTH_URL is not set" >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 120 --retry 2 --retry-all-errors -o /dev/null "$API_HEALTH_URL"
