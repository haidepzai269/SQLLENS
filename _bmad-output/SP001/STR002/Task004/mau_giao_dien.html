<!doctype html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQLLens: mẫu giao diện</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Public+Sans:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
<style>
:root {
  --ground: #171719; --stage: #0e0e10; --surface: #131217; --raised: #212023;
  --border: #2a2a2e; --rule: #1f1e23; --control: #3a3a3e;
  --text: #ffffff; --ink2: #c4c5c9; --muted: #92949a;
  --lamp: #f2b84b; --lamp-ink: #17130a;
  --negative: #ef6b82;
  --radius: 4px;
  --h-top: 44px; --h-bar: 40px;
  --sp1: 4px; --sp2: 8px; --sp3: 12px; --sp4: 16px; --sp5: 24px;
  --fs-body: 13px; --fs-small: 12px; --fs-micro: 12px; --edge: 16px;
  --sans: "Public Sans", "Segoe UI", system-ui, -apple-system, Roboto, "Noto Sans", sans-serif;
  --mono: "JetBrains Mono", "Cascadia Mono", Consolas, "DejaVu Sans Mono", "Noto Sans Mono", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--ground); color: var(--text); font: 400 var(--fs-body)/20px var(--sans);
  display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden;
  font-variant-numeric: tabular-nums;
}
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled, button[aria-disabled="true"] { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--lamp); outline-offset: 1px; border-radius: 2px; }
svg { display: block; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
.skip { position: absolute; left: 8px; top: -60px; background: var(--text); color: var(--ground); padding: 8px 12px; z-index: 10; }
.skip:focus { top: 8px; }

/* Lựa chọn: một đường 1px màu đèn đúng bằng chiều rộng nhãn, nằm trên cạnh gần nhất. */
.sel { position: relative; height: 100%; padding: 0 var(--sp2); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; flex: none; }
.sel:hover { color: var(--text); }
.sel[aria-pressed="true"] { color: var(--text); font-weight: 500; }
.sel[aria-pressed="true"]::after { content: ""; position: absolute; left: var(--sp2); right: var(--sp2); bottom: 0; height: 1px; background: var(--lamp); }
.sel.locked, .sel.locked:hover { color: var(--muted); }
.sel svg { width: 14px; height: 14px; }

/* Nhãn kết luận: phân biệt bằng hình và chữ, không dùng màu. */
.tag { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 2px; font-size: var(--fs-small); font-weight: 500; white-space: nowrap; flex: none; border: 1px solid transparent; }
.tag svg { width: 11px; height: 11px; flex: none; }
.tag-real { background: var(--text); color: var(--surface); border-color: var(--text); }
.tag-sim { border: 1px solid var(--ink2); color: var(--text); }
.tag-est { border: 1px dashed var(--ink2); color: var(--text); font-style: italic; }
.tag-unsim { border: 3px double var(--ink2); color: var(--text); height: 24px; }
.tag-demo { color: var(--ink2); padding: 0; font-weight: 400; }

/* Thanh trên */
.top { height: var(--h-top); display: flex; align-items: center; gap: var(--sp4); padding: 0 var(--sp3); border-bottom: 1px solid var(--border); flex: none; }
.brand { display: flex; align-items: center; gap: var(--sp2); font-weight: 600; font-size: 14px; flex: none; }
.brand svg { width: 20px; height: 20px; }
h1 { font-weight: 500; font-family: var(--mono); font-size: 13px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.engines { display: flex; align-self: stretch; margin-left: var(--sp2); flex: none; }
.spacer { flex: 1; min-width: 0; }
.tools { display: flex; align-items: stretch; align-self: stretch; flex: none; }
.tools .sep { width: 1px; background: var(--border); margin: 10px var(--sp2); }
.btn { height: 28px; padding: 0 var(--sp3); border: 1px solid var(--control); border-radius: var(--radius); align-self: center; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn-primary { background: var(--text); color: var(--ground); border-color: var(--text); font-weight: 600; }
.btn-primary:hover { background: var(--ink2); border-color: var(--ink2); }
.iconbtn { width: 32px; height: 28px; display: inline-flex; align-items: center; justify-content: center; align-self: center; border-radius: var(--radius); color: var(--muted); border: 1px solid transparent; }
.iconbtn:hover:not(:disabled) { color: var(--text); border-color: var(--control); }
.iconbtn:disabled { opacity: .35; }
.iconbtn svg { width: 16px; height: 16px; }
.togs { display: flex; align-items: center; gap: 2px; }
.toggle { position: relative; }
.toggle[aria-pressed="true"] { color: var(--text); }
.toggle[aria-pressed="true"]::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -8px; height: 1px; background: var(--lamp); }
.demo-strip { display: none; }

/* Khung làm việc */
.work { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.cols { flex: 1; min-height: 0; display: flex; }
.panel { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--surface); }
.panel.off { display: none; }
#pSql { flex: 0 0 var(--w-left, 320px); }
#pRisk { flex: 0 0 var(--w-right, 348px); }
#pStage { flex: 1 1 0; background: var(--stage); }
#pTerm { flex: 0 0 var(--h-term, 180px); background: var(--stage); }
.panel.grow { flex: 1 1 0 !important; }
.handle { flex: none; position: relative; background: var(--border); z-index: 2; }
.handle.off { display: none; }
.handle.v { width: 1px; cursor: col-resize; }
.handle.h { height: 1px; cursor: row-resize; }
.handle::before { content: ""; position: absolute; }
.handle.v::before { inset: 0 -4px; }
.handle.h::before { inset: -4px 0; }
.handle:hover, .handle.drag, .handle:focus-visible { background: var(--lamp); outline: 0; }
body.dragging { user-select: none; }
.bar { height: var(--h-bar); flex: none; display: flex; align-items: center; gap: var(--sp2); padding: 0 var(--sp3); border-bottom: 1px solid var(--border); }
.bar h2 { font-size: var(--fs-body); font-weight: 600; white-space: nowrap; }
.bar .tabs { display: flex; align-self: stretch; margin-left: calc(var(--sp2) * -1); min-width: 0; overflow-x: auto; scrollbar-width: none; }
.scroll { flex: 1; min-height: 0; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--control) transparent; }

/* Cột SQL */
.editor { flex: 1 1 56%; min-height: 150px; display: flex; border-bottom: 1px solid var(--border); }
.gutter { width: 44px; flex: none; padding: var(--sp3) var(--sp2) var(--sp3) 0; text-align: right; color: var(--muted); font: 400 var(--fs-small)/20px var(--mono); overflow: hidden; user-select: none; white-space: pre; }
#sql { flex: 1; min-width: 0; resize: none; border: 0; outline-offset: -2px; background: transparent; padding: var(--sp3) var(--sp3) var(--sp3) var(--sp1); font: 400 13px/20px var(--mono); color: var(--ink2); white-space: pre; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--control) transparent; }
.stmts { flex: 1 1 44%; min-height: 0; }
.sub { padding: var(--sp3) var(--sp3) var(--sp1); font-size: var(--fs-small); color: var(--muted); }
.stmt { width: 100%; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 0 var(--sp1); padding: 6px var(--sp3); text-align: left; }
.stmt:hover { background: var(--ground); }
.stmt[aria-pressed="true"] { background: var(--raised); }
.stmt .n { font: 400 var(--fs-small)/20px var(--mono); color: var(--muted); }
.stmt b { font-weight: 500; display: block; }
.stmt small { display: block; font: 400 var(--fs-micro)/18px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gate { margin: var(--sp2) var(--sp3) var(--sp3); padding: var(--sp2); border: 1px solid var(--border); border-radius: var(--radius); font-size: var(--fs-small); line-height: 18px; color: var(--ink2); }

/* Cảnh giữa */
.scene { flex: 1; min-height: 0; display: flex; flex-direction: column; container-type: inline-size; }
.scene[hidden] { display: none; }
#treeWrap { flex: 1; min-height: 220px; overflow: auto; position: relative; scrollbar-width: thin; scrollbar-color: var(--control) transparent; }
#tree { width: 100%; }
#tree text { font-family: var(--mono); fill: var(--ink2); font-size: 12.5px; }
#tree .lane { fill: var(--muted); font-size: 12px; font-family: var(--sans); }
#tree .cap { fill: var(--muted); font-size: 11px; }
#tree .ttl { fill: var(--ink2); font-size: 12px; font-family: var(--sans); }
#tree .frame { fill: var(--surface); stroke: var(--control); stroke-width: 1; }
#tree .div { stroke: var(--control); stroke-width: 1; }
#tree .clu { fill: var(--stage); stroke: var(--control); stroke-dasharray: 3 3; }
#tree .clutxt { fill: var(--ink2); }
#tree .edge { fill: none; stroke: var(--control); stroke-width: 1; }
#tree .edgelit { fill: none; stroke: var(--lamp); stroke-width: 1.5; stroke-dasharray: 1; stroke-dashoffset: 1; }
#tree .nodelit { fill: none; stroke: var(--lamp); stroke-width: 1.5; opacity: 0; }
#tree .celllit { fill: var(--lamp); opacity: 0; }
#tree .heap { fill: var(--surface); stroke: var(--control); }
#tree .heaplit { fill: var(--lamp); opacity: 0; }
#tree .chip rect { fill: var(--lamp); }
#tree .chip text { fill: var(--lamp-ink); font-weight: 700; }
.say { flex: none; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--sp2) var(--sp4); align-items: center; padding: var(--sp2) var(--sp3); border-top: 1px solid var(--border); background: var(--surface); min-height: 72px; }
#explain { font-size: 14px; line-height: 20px; }
#explain code { font-family: var(--mono); font-size: 13px; color: var(--lamp); }
.steplabel { display: block; color: var(--muted); font-size: var(--fs-small); line-height: 18px; }
.transport { display: flex; align-items: center; gap: 2px; flex: none; }
.transport .iconbtn { height: 32px; }
#scrub { width: 96px; margin: 0 var(--sp2); }
#rmNote { grid-column: 1 / -1; font-size: var(--fs-small); color: var(--muted); }
.gauges { flex: none; display: grid; grid-template-columns: 1fr; border-top: 1px solid var(--border); background: var(--surface); }
@container (min-width: 640px) { .gauges { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); } .race { border-top: 0 !important; border-left: 1px solid var(--border); } }
.cap, .race { padding: var(--sp2) var(--sp3); min-width: 0; }
.race { border-top: 1px solid var(--border); }
.ghead { display: flex; align-items: center; justify-content: space-between; gap: var(--sp2); font-size: var(--fs-small); color: var(--muted); min-height: 20px; }
.slider { padding-top: 2px; }
input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; height: 20px; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 1px; background: var(--muted); }
input[type=range]::-moz-range-track { height: 1px; background: var(--muted); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 9px; height: 15px; margin-top: -7px; background: var(--text); border-radius: 1px; }
input[type=range]::-moz-range-thumb { width: 9px; height: 15px; background: var(--text); border: 0; border-radius: 1px; }
#scale::-webkit-slider-thumb { background: var(--lamp); }
#scale::-moz-range-thumb { background: var(--lamp); }
#scale { width: 100%; margin: 0; display: block; }
.ticks { display: flex; justify-content: space-between; font: 400 var(--fs-micro)/16px var(--mono); color: var(--muted); }
.ticks button { color: inherit; font: inherit; padding: 0 2px; }
.ticks button:hover, .ticks button[aria-pressed="true"] { color: var(--text); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp2); margin-top: 4px; }
.stats dt { font-size: var(--fs-micro); line-height: 16px; color: var(--muted); }
.stats dd { font: 500 14px/20px var(--mono); }
.stats dd span { font-size: var(--fs-micro); color: var(--muted); font-weight: 400; }
.racerow { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; align-items: center; gap: var(--sp2); font-size: var(--fs-small); line-height: 22px; }
.track { height: 4px; background: var(--raised); position: relative; }
.fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink2); min-width: 0; }
.fill.lit { background: var(--lamp); }
.racerow .v { font: 500 var(--fs-small)/22px var(--mono); text-align: right; min-width: 74px; }
.unsim { margin: auto; max-width: 480px; padding: var(--sp5); }
.unsimbox { border: 3px double var(--control); padding: var(--sp4); display: grid; gap: var(--sp3); }
.unsimbox h3 { font-size: 16px; font-weight: 600; line-height: 22px; }
.unsimbox p { color: var(--ink2); }

/* Sơ đồ bảng */
#schemaWrap { position: relative; padding: var(--sp5) var(--sp4); min-height: 100%; }
@container (min-width: 560px) { #schemaWrap { padding-right: 40px; } }
#schemaLines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#schemaLines path { fill: none; stroke: var(--muted); stroke-width: 1; }
#schemaLines path.warn { stroke: var(--negative); }
#schemaLines circle { fill: var(--stage); stroke: var(--muted); }
#schemaLines circle.warn { stroke: var(--negative); }
.tables { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp5); max-width: 720px; margin: 0 auto; }
@container (min-width: 560px) { .tables { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 88px; row-gap: 40px; align-items: start; } .fkto { display: none; } }
.tcard { background: var(--surface); border: 1px solid var(--control); border-radius: var(--radius); min-width: 0; }
.tcard h3 { font: 600 var(--fs-body)/32px var(--mono); padding: 0 var(--sp3); border-bottom: 1px solid var(--control); display: flex; justify-content: space-between; gap: var(--sp2); }
.tcard h3 span { font-weight: 400; color: var(--muted); font-size: var(--fs-micro); }
.trow { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: var(--sp1); align-items: center; padding: 0 var(--sp3) 0 var(--sp2); font: 400 13px/26px var(--mono); }
.trow + .trow { border-top: 1px solid var(--rule); }
.trow .ty { color: var(--muted); font-size: var(--fs-micro); }
.trow .k svg { width: 12px; height: 12px; color: var(--muted); }
.trow .cn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .noidx { grid-column: 2 / -1; font: 400 var(--fs-micro)/16px var(--sans); color: var(--negative); padding-bottom: 5px; margin-top: -3px; }
.fkto { grid-column: 2 / -1; font-size: var(--fs-micro); line-height: 16px; color: var(--muted); padding-bottom: 5px; margin-top: -3px; }

/* Cây plan */
.plan { padding: var(--sp4); max-width: 680px; }
.plan ul { margin-left: 15px; padding-left: 15px; border-left: 1px solid var(--control); }
.plan li { position: relative; padding-top: var(--sp3); }
.plan ul > li::before { content: ""; position: absolute; left: -15px; top: 34px; width: 15px; height: 1px; background: var(--control); }
.plan ul > li:last-child::after { content: ""; position: absolute; left: -16px; top: 35px; bottom: 0; width: 1px; background: var(--stage); }
.pnode { background: var(--surface); border: 1px solid var(--control); border-radius: var(--radius); padding: var(--sp2) var(--sp3); }
.pnode.hot { border-color: var(--lamp); }
.pnode header { display: flex; gap: var(--sp2); flex-wrap: wrap; align-items: baseline; }
.pnode b { font-weight: 600; }
.pnode header span { font: 400 var(--fs-small)/20px var(--mono); color: var(--muted); }
.pm { display: flex; flex-wrap: wrap; gap: 2px var(--sp4); font: 400 13px/20px var(--mono); }
.pm i { font: 400 13px/20px var(--sans); font-style: normal; color: var(--muted); margin-right: var(--sp1); }
.ptotal { padding: var(--sp3) var(--sp4) 0; display: flex; flex-wrap: wrap; gap: var(--sp2); align-items: center; color: var(--ink2); }

/* Rủi ro */
.assume { padding: var(--sp3); border-bottom: 1px solid var(--border); }
.assume strong { display: block; font-weight: 600; font-size: 14px; }
.assume p { color: var(--muted); font-size: var(--fs-small); line-height: 18px; margin-top: 2px; }
.find { padding: var(--sp3); border-bottom: 1px solid var(--border); display: grid; gap: 6px; }
.find .fh { display: flex; align-items: center; justify-content: space-between; gap: var(--sp2); min-height: 24px; }
.find .verdict { font-size: var(--fs-small); font-weight: 500; color: var(--ink2); }
.find .verdict.broke { color: var(--negative); }
.find h3 { font-size: 14px; line-height: 20px; font-weight: 600; }
.find p { color: var(--ink2); line-height: 19px; }
.find dl { display: grid; gap: 0; margin-top: 2px; }
.find dl div { display: flex; justify-content: space-between; gap: var(--sp3); border-top: 1px solid var(--rule); padding: 3px 0; font-size: 13px; }
.find dt { color: var(--muted); }
.find dd { font-family: var(--mono); text-align: right; white-space: nowrap; }
.link { justify-self: start; font-size: var(--fs-small); color: var(--text); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--muted); }
.link:hover { text-decoration-color: var(--text); }
.mentor { padding: var(--sp3); display: grid; gap: var(--sp2); font-size: var(--fs-small); color: var(--ink2); line-height: 18px; }
.mentor strong { color: var(--text); font-size: var(--fs-body); font-weight: 600; }

/* Terminal */
#log { padding-top: var(--sp2); padding-bottom: var(--sp2); font: 400 13px/20px var(--mono); }
#log li { display: grid; grid-template-columns: 26px 100px minmax(0, 1fr); gap: 0 var(--sp2); color: var(--ink2); }
#log .i { color: var(--muted); text-align: right; }
#log .m { color: var(--muted); }
#log li.now .t { color: var(--text); }
#log li.now .i { color: var(--lamp); }
.results { font: 400 13px/26px var(--mono); border-collapse: collapse; }
.results th { font: 400 var(--fs-small)/26px var(--sans); color: var(--muted); text-align: left; padding: 0 var(--sp4) 0 var(--sp3); white-space: nowrap; }
.results td { padding: 0 var(--sp4) 0 var(--sp3); border-top: 1px solid var(--rule); white-space: nowrap; }
.results .num { text-align: right; }
.rnote { padding: var(--sp1) var(--sp3) var(--sp2); color: var(--muted); font-size: var(--fs-small); }
.phonetabs { display: none; }
.termnote { font-size: var(--fs-small); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.top, .bar, .sub, .stmt, .assume, .find, .mentor, .cap, .race, .say, #log, .rnote { padding-left: var(--edge); padding-right: var(--edge); }
.gate { margin-left: var(--edge); margin-right: var(--edge); }
.results th:first-child, .results td:first-child { padding-left: var(--edge); }

/* Điện thoại và máy bảng nhỏ: mỗi lúc một vùng. */
@media (max-width: 900px) {
  :root { --fs-body: 14px; --fs-small: 12px; }
  .top { gap: var(--sp2); }
  .top .tag-demo, #toggles, #toolSep { display: none; }
  .top h1 { flex: 1 1 0; }
  .top > .spacer { display: none; }
  .bar .tabs { margin-left: -6px; }
  .engines { order: 5; }
  .topwrap { flex-wrap: wrap; height: auto; }
  .engines { width: 100%; height: 40px; margin: 0; border-top: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
  .top { padding-top: 6px; }
  .sel { padding: 0 6px; }
  .sel[aria-pressed="true"]::after { left: 6px; right: 6px; }
  .demo-strip { display: block; flex: none; padding: 3px var(--edge); font-size: var(--fs-small); line-height: 18px; color: var(--ink2); background: var(--surface); border-bottom: 1px solid var(--border); }
  .handle { display: none !important; }
  .termnote { display: none; }
  .panel, .panel.off { display: none; flex: 1 1 0 !important; }
  .cols { display: block; flex: 1; }
  .work[data-tab="sql"] .cols, .work[data-tab="stage"] .cols, .work[data-tab="risk"] .cols { display: flex; }
  .work[data-tab="term"] .cols { display: none; }
  .work[data-tab="sql"] #pSql, .work[data-tab="stage"] #pStage, .work[data-tab="risk"] #pRisk, .work[data-tab="term"] #pTerm { display: flex; }
  .iconbtn, .btn { min-height: 36px; }
  .transport .iconbtn { width: 44px; height: 44px; }
  .say { grid-template-columns: minmax(0, 1fr); }
  .transport { justify-content: space-between; }
  #scrub { flex: 1; width: auto; min-width: 0; }
  .ticks button { min-height: 28px; padding: 0 6px; }
  #sql { font-size: 16px; line-height: 22px; }
  .gutter { line-height: 22px; font-size: 13px; }
  .stmt { padding-top: 8px; padding-bottom: 8px; }
  .phonetabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); height: 56px; flex: none; border-top: 1px solid var(--border); background: var(--surface); }
  .phonetabs button { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-size: var(--fs-small); line-height: 16px; }
  .phonetabs svg { width: 18px; height: 18px; }
  .phonetabs button[aria-pressed="true"] { color: var(--text); }
  .phonetabs button[aria-pressed="true"]::after { content: ""; position: absolute; top: -1px; left: 50%; width: 40px; margin-left: -20px; height: 1px; background: var(--lamp); }
  #log li { grid-template-columns: 20px minmax(0, 1fr); }
  #log .m { grid-column: 2; }
  #log .t { grid-column: 2; }
  #log .i { grid-row: 1 / span 2; }
}
@media (max-width: 640px) {
  #sceneTree { display: block; overflow-y: auto; }
  #sceneTree[hidden] { display: none; }
  #treeWrap { overflow: visible; min-height: 0; }
  .say { position: sticky; bottom: 0; z-index: 1; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }

    pointMy: sec.length + MATCH_POINT * clu.length,

  else if (b.id === "tPrev") goTo(curStep() - 1);
  else if (b.id === "tNext") goTo(curStep() + 1);
  else if (b.id === "tPlay") { if (scene && scene.tl.isActive() && !scene.tl.paused()) scene.tl.pause(); else playScene(); }
});
function setTab(k) { S.tab = k; $("work").dataset.tab = k; renderPhoneTabs(); requestAnimationFrame(() => { if (k === "stage" && S.scene === "tree" && lastW !== $("treeWrap").clientWidth) rebuildKeep(); drawSchemaLines(); }); }
function setScale(v) {
  const k = curStep();
  S.scale = v; buildScene(k); renderTermTabs();
  if (scene && !REDUCED.matches) {
    gsap.from("#tree .row", { opacity: 0, y: -14, duration: .35, stagger: .06, ease: "power2.out", clearProps: "transform" });
  }
}
$("scale").addEventListener("input", (e) => setScale(+e.target.value));
$("scrub").addEventListener("input", (e) => { if (!scene) return; if (moveTw) moveTw.kill(); scene.tl.pause(); scene.tl.seek(scene.ends[+e.target.value], false); syncScene(true); });
$("sql").addEventListener("input", syncGutter);
$("sql").addEventListener("scroll", () => { $("gutter").scrollTop = $("sql").scrollTop; });
$("pStage").addEventListener("keydown", (e) => {
  if (e.target.matches("input,textarea")) return;
  if (e.key === "ArrowRight") { e.preventDefault(); goTo(curStep() + 1); }
  if (e.key === "ArrowLeft") { e.preventDefault(); goTo(curStep() - 1); }
});
let lastW = 0, lastH = 0;
function rebuildKeep() { const k = curStep(); lastW = $("treeWrap").clientWidth; lastH = $("treeWrap").clientHeight; buildScene(k); }
new ResizeObserver(() => {
  const w = $("treeWrap").clientWidth, h = $("treeWrap").clientHeight;
  if (w && h && (Math.abs(w - lastW) > 2 || Math.abs(h - lastH) > 40) && S.scene === "tree") {
    const running = scene && scene.tl.isActive() && !scene.tl.paused();
    rebuildKeep();
    if (running) playScene();
  }
  drawSchemaLines();
}).observe($("pStage"));
REDUCED.addEventListener("change", () => { const k = curStep(); updateMotionNote(); buildScene(k); });

/* ---------- Khởi động ---------- */
renderSqlBox();
layoutPanels();
renderAll(0);
lastW = $("treeWrap").clientWidth; lastH = $("treeWrap").clientHeight;
const boot = () => { rebuildKeep(); drawSchemaLines(); if (!REDUCED.matches && !location.hash.includes("nostart")) startScene(); };
if (document.fonts && document.fonts.ready) Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 1500))]).then(boot); else boot();
window.__sqllens = { S, T, goTo, curStep, setScale, selectStmt, get scene() { return scene; } };
</script>
</body>
